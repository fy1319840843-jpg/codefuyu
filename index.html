{
 const roots=new Set(["sort out", "reinterpretation", "violate", "statistical", "diminish", "foreseeable"]);
 for(const word of roots){

 }
}

D.forEach(c=>{c.k=c.w;c.w=c.w.split(' ← ').map(p=>/^[A-Z][^A-Z]*$/.test(p)?p[0].toLowerCase()+p.slice(1):p).join(' ← ')});
function list(){const q=$('q').value.trim().toLowerCase(),g=$('g').value;

<div class="${st.hide?'hide':''}" onclick="this.classList.remove('hide')"><div class="z">${esc(c.z)}</div><div class="e">${esc(c.e)}</div></div>
${c.m?`<div class="m">多次出现：${esc(c.m)}</div>`:''}</div><button class="chk" data-n="${n}" aria-label="标记掌握">${S[key(c)]?'✓':'○'}</button></div>`});
M.innerHTML=h;
M.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{const c=L[+b.dataset.n];S[key(c)]=!S[key(c)];save();render()})}
$('q').oninput=$('g').onchange=()=>{st.i=0;st.flip=false;render()};
$('tList').onclick=()=>{st.mode='list';render()};$('tCard').onclick=()=>{st.mode='card';st.flip=false;render()};

$('fUnk').onclick=()=>{st.unk=!st.unk;st.i=0;render()};$('fMul').onclick=()=>{st.mul=!st.mul;st.i=0;render()};
render();
